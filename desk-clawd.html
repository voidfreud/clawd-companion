<title>Desk Clawd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["overlay", "menu-bar"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the page is only a doorway. In the installed app the window turns invisible and Clawd walks along the bottom of the real screen. */
:root{
  --bg:#17130F; --bg2:#0F0C0A; --ink:#F3ECE6; --muted:#B4A89E; --line:#3A312A;
  --menu:#FBF8F5; --menu-ink:#1E1915; --menu-muted:#7A6E65; --menu-line:#E7DFD8; --menu-hover:#F1E7DF;
  --clawd:#D77757; --clawd-dark:#B95F42; --eye:#1A1614;
  --cookie:#C8925A; --chip:#5A3A24; --ball:#4F84E0; --shine:#E8EEF9; --heart:#E0566C;
  --shadow:rgba(0,0,0,.28); --bubble:#FFFFFF; --bubble-ink:#1E1915;
  --font-pixel:"Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
  --font-body:"Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--font-body);overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}

.intro{position:absolute;top:28px;left:max(28px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));max-width:440px;display:grid;gap:10px;z-index:1}
.intro h1{margin:0;font-family:var(--font-pixel);font-weight:400;font-size:24px;letter-spacing:.02em;color:var(--ink)}
.intro p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.intro p.small{font-size:12.5px}
.intro .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font:600 13px/1 var(--font-body);color:var(--eye);background:var(--clawd);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.btn:hover{background:#E58A6B}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.06)}

/* Installed app before it may float: a small card, nothing else */
html.gate .intro{inset:0;max-width:none;place-content:center;justify-items:center;text-align:center;padding:24px}
html.gate .intro p{max-width:300px}

/* Loose on the desktop */
/* color-scheme must match the app's frame, or the browser paints an opaque backdrop behind a transparent page */
html.overlay{color-scheme:light}
html.overlay, html.overlay body{background:transparent!important}
html.overlay .intro{display:none}

#clawd{position:absolute;left:0;top:0;cursor:grab;touch-action:none;z-index:3;outline:none}
#clawd.held{cursor:grabbing}
#clawd svg{display:block;width:100%;height:100%;overflow:visible;shape-rendering:crispEdges}
#clawd:focus-visible svg{filter:drop-shadow(0 0 0 2px var(--ink))}
.c-body{fill:var(--clawd)}
.c-eye{fill:var(--eye)}
#shadow{position:absolute;height:7px;border-radius:50%;background:var(--shadow);z-index:2;pointer-events:none}
html.gate #clawd, html.gate #shadow{display:none}

.obj{position:absolute;left:0;top:0;z-index:2;touch-action:none}
.obj svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}
.ball{cursor:pointer}

.bubble{position:absolute;left:0;top:0;z-index:5;max-width:240px;padding:7px 11px;background:var(--bubble);color:var(--bubble-ink);
  border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);font:500 13px/1.4 var(--font-body);pointer-events:none;opacity:0;transition:opacity .18s}
.bubble.on{opacity:1}
.bubble .ico{display:inline-block;width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.bubble .ico svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}
.bubble::after{content:"";position:absolute;bottom:-5px;left:var(--tail,50%);width:10px;height:10px;margin-left:-5px;background:var(--bubble);transform:rotate(45deg)}

.fx{position:absolute;z-index:4;pointer-events:none;animation:rise 1.5s ease-out forwards}
.fx.z svg{display:block;width:100%;height:100%;shape-rendering:crispEdges;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.fx.crumb{width:5px;height:5px;background:var(--cookie);animation:crumb .7s ease-in forwards}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0px),-70px) scale(1.1)}}
@keyframes crumb{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx,0px),26px)}}

/* Clawd's own right-click menu */
#menu{position:absolute;z-index:10;min-width:190px;background:var(--menu);color:var(--menu-ink);border-radius:10px;padding:5px;
  box-shadow:0 10px 30px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06);font:500 13px/1 var(--font-body)}
#menu button.item{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:7px 10px;border-radius:6px;cursor:pointer}
#menu button.item:hover, #menu button.item:focus-visible{background:var(--menu-hover)}
#menu .check{color:var(--clawd-dark);font-weight:600}
#menu hr{border:0;border-top:1px solid var(--menu-line);margin:5px 4px}
#menu .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 10px}
#menu .opt span{color:var(--menu-muted);font-size:12px}
#menu .seg{display:flex;gap:4px}
#menu .seg button{all:unset;box-sizing:border-box;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--menu-ink);cursor:pointer}
#menu .seg button:hover{background:var(--menu-hover)}
#menu .seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--clawd-dark);color:var(--clawd-dark)}
#menu .needs{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:6px 10px 5px;font-size:12px;color:var(--menu-muted)}
#menu .bar{height:6px;border-radius:3px;background:var(--menu-line);overflow:hidden}
#menu .bar i{display:block;height:100%;background:var(--clawd-dark)}
#menu .bar i.low{background:var(--heart)}
#menu .swatch{width:14px;height:14px;border-radius:50%;display:block}
@media (prefers-reduced-motion: reduce){.fx{animation-duration:.9s}}
</style>

<div id="stage">
  <div class="intro" id="intro">
    <h1>Desk Clawd</h1>
    <p id="introText">A small Clawd who lives along the bottom of your screen. To let Clawd out, open this in the Claude desktop app, click the name above the page and choose Install as app.</p>
    <p class="small">Click to pet. Drag to carry and toss. Right-click Clawd for snacks, the ball, naps and size.</p>
    <div class="row" id="introActions"></div>
  </div>
  <div id="shadow"></div>
  <div id="clawd" role="button" tabindex="0" aria-label="Clawd. Press to pet, drag to carry, right-click for more.">
    <svg viewBox="-3 -2 18 12.5" aria-hidden="true">
      <g id="squash">
        <rect class="c-body leg" x="1" y="8" width="1" height="2"/>
        <rect class="c-body leg" x="3" y="8" width="1" height="2"/>
        <rect class="c-body leg" x="8" y="8" width="1" height="2"/>
        <rect class="c-body leg" x="10" y="8" width="1" height="2"/>
        <g id="torso">
          <rect class="c-body" id="armL" x="-2" y="4" width="2" height="2"/>
          <rect class="c-body" id="armR" x="12" y="4" width="2" height="2"/>
          <rect class="c-body" id="body" x="0" y="0" width="12" height="8"/>
          <rect class="c-eye" id="eyeL" x="2" y="2" width=".9" height="2"/>
          <rect class="c-eye" id="eyeR" x="9.1" y="2" width=".9" height="2"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="bubble" id="bubble" aria-live="polite"></div>
  <div id="menu" role="menu" hidden></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const rand = (a,b) => a + Math.random()*(b-a);
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const root = document.documentElement;

  function pix(rows, map){
    const h = rows.length, w = rows[0].length; let r = '';
    rows.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(map[ch]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" style="fill:${map[ch]}"/>`; }));
    return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${r}</svg>`;
  }
  const HEART = pix(['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'],{X:'var(--heart)'});
  const COOKIE = pix(['.XXXX.','XXoXXX','XXXXoX','XoXXXX','XXXoXX','.XXXX.'],{X:'var(--cookie)',o:'var(--chip)'});
  const ZED = pix(['XXXX','..X.','.X..','XXXX'],{X:'var(--muted)'});
  const NOTE = pix(['..XXX','..X.X','..X..','XXX..','XXX..'],{X:'var(--muted)'});
  const BALL = pix(['.XXXX.','XwXXXX','wXXXXX','XXXXXX','XXXXXX','.XXXX.'],{X:'var(--ball)',w:'var(--shine)'});

  const stage = $('stage'), el = $('clawd'), shadow = $('shadow'), bubble = $('bubble'), menu = $('menu');
  const P = { squash:$('squash'), torso:$('torso'), armL:$('armL'), armR:$('armR'), eyeL:$('eyeL'), eyeR:$('eyeR'), legs:[...el.querySelectorAll('.leg')] };

  // ---------- settings & state ----------
  const SIZES = { S:5, M:7, L:9.5 };
  const COLORS = { Clay:'#D77757', Sand:'#C9A27A', Ink:'#5B6470' };
  const prefs = { size:'M', color:'Clay', stay:false };
  let stats = { energy:80, food:70, joy:70 }, lastSeen = 0;
  try {
    const s = JSON.parse(localStorage.getItem('desk-clawd') || 'null');
    if (s){ ['energy','food','joy'].forEach(k => { if (typeof s[k]==='number') stats[k] = clamp(s[k],0,100); }); lastSeen = s.seen||0;
      if (SIZES[s.size]) prefs.size = s.size; if (COLORS[s.color]) prefs.color = s.color; prefs.stay = !!s.stay; }
  } catch(e){}
  // Time keeps passing while the app is closed: after a long absence Clawd is rested, a bit peckish, and glad to see you.
  const closedSec = lastSeen ? clamp((Date.now() - lastSeen)/1000, 0, 24*3600) : 0;
  if (closedSec > 60){
    stats.food = Math.max(0, stats.food - closedSec*.004);
    stats.joy = Math.max(0, stats.joy - closedSec*.002);
    if (closedSec > 600) stats.energy = 100;
  }
  if (closedSec > 600) stats.joy = Math.min(100, stats.joy + 15);
  function save(){ try { localStorage.setItem('desk-clawd', JSON.stringify({...stats, ...prefs, seen:Date.now()})); } catch(e){} }
  setInterval(save, 5000); document.addEventListener('visibilitychange', save);
  function applyColor(){ root.style.setProperty('--clawd', COLORS[prefs.color]); }
  applyColor();

  // Needs drain slowly: a full Clawd gets hungry over about an hour and a quarter, not twenty minutes.
  const RATE = { food:.022, joy:.012, energy:.025, chase:.5, sleep:1.4 };

  const S = { x:0, y:0, vx:0, vy:0, state:'idle', stateT:0, t:0, wait:1.5, tx:0, blinkAt:2, blinkT:0, squashT:0, lastZ:0,
              lookX:0, lookY:0, kickCD:0, chaseCD:0, target:null, moveDir:1,
              on:null, ignorePlat:null, jumping:false, then:null, hopDir:1, climb:null, userAway:false,
              exitDir:1, goneFor:0, waveCD:20, thinkAt:30, noteAt:0, rideSaid:-99 };
  let mode = 'page';   // 'page' | 'gate' | 'overlay'
  let wake = () => {}; // replaced by the frame loop below
  let W=0, H=0, u=7, SW=126, SH=88, floorY=0;
  const pointer = { x:-1e4, y:-1e4, t:-99 };
  const snacks = []; let ball = null;

  // ---------- where Clawd can stand ----------
  // The floor, plus the visible top edges of your windows (sent by the native app).
  let rawPlatforms = [], platforms = [];
  const OFFSTAGE = new Set(['exit','gone','enter']);
  const surfaceY = () => S.on ? S.on.y : floorY;
  const groundY = () => surfaceY() - 12*u;
  const feetY = () => S.y + 12*u;
  const center = () => S.x + 9*u;
  const xMin = () => S.on ? Math.max(0, S.on.x1 - 7*u) : 0;
  const xMax = () => S.on ? Math.min(W - SW, S.on.x2 - 11*u) : Math.max(0, W-SW);
  function filterPlatforms(){
    platforms = rawPlatforms
      .map(p => ({ id:p.id, wx:p.wx, y:p.y, x1:Math.max(0, p.x1), x2:Math.min(W, p.x2) }))
      .filter(p => p.x2 - p.x1 >= 18*u && p.y - SH - 8 > 0 && p.y < floorY - 8*u);
  }
  function measure(){
    W = stage.clientWidth; H = stage.clientHeight;
    u = SIZES[prefs.size]; SW = 18*u; SH = 12.5*u; floorY = H - (mode==='overlay' ? 1 : 6);
    el.style.width = SW+'px'; el.style.height = SH+'px';
    filterPlatforms();
    if (S.on){ const c = center(), id = S.on.id; S.on = platforms.find(p => p.id===id && c >= p.x1 && c <= p.x2) || null; }
    if (!OFFSTAGE.has(S.state)) S.x = clamp(S.x, xMin(), xMax());
    if (S.state!=='held' && S.state!=='fall') S.y = groundY();
    snacks.forEach(s => { s.size = 3.2*u; s.x = clamp(s.x, 0, W-s.size); if (s.landed) s.y = floorY - s.size; });
    if (ball){ ball.size = 3.4*u; ball.x = clamp(ball.x, 0, W-ball.size); ball.y = Math.min(ball.y, floorY-ball.size); }
  }
  new ResizeObserver(measure).observe(stage);
  measure(); S.x = W*.62; S.y = groundY();

  function setPlatforms(list){
    rawPlatforms = Array.isArray(list) ? list : [];
    filterPlatforms();
    if (!S.on) return;
    const old = S.on, same = platforms.filter(p => p.id === old.id);
    const dx = same.length ? same[0].wx - old.wx : 0, dy = same.length ? same[0].y - old.y : 0;
    const c = center() + dx, seg = same.find(p => c >= p.x1 + u && c <= p.x2 - u);
    if (!seg){
      S.on = null;
      if (S.state === 'held') return;
      say(same.length ? pick(['Whoa!','Slipped!','Hey, the edge moved!']) : pick(['Hey! I was standing on that!','Where did my window go?','Window closed. Rude.']), 2200);
      go('fall', { vx:0, vy:0 });
      return;
    }
    S.on = seg; S.x += dx; S.tx += dx;
    if (S.state !== 'held' && S.state !== 'fall') S.y = groundY();
    if ((Math.abs(dx) > 40 || Math.abs(dy) > 40) && S.t - S.rideSaid > 10){ S.rideSaid = S.t; say(pick(['Wheee, a ride!','Where are we going?','Moving day!']), 1600); }
    wake();
  }

  // ---------- speech & effects ----------
  let bubbleTimer = 0;
  const recent = [];
  function fresh(list){ const pool = list.filter(l => !recent.includes(l)); const l = pick(pool.length ? pool : list); recent.push(l); if (recent.length > 12) recent.shift(); return l; }
  function say(text, ms, icon){
    bubble.textContent = '';
    if (icon){ const i = document.createElement('span'); i.className = 'ico'; i.innerHTML = icon; bubble.appendChild(i); }
    bubble.appendChild(document.createTextNode(text));
    bubble.classList.add('on'); wake();
    clearTimeout(bubbleTimer); bubbleTimer = setTimeout(()=>bubble.classList.remove('on'), ms || 2600 + text.length*35);
  }
  const QUIPS = ['*clack clack*','Thinking…','Ship it!','Tests are green in my heart.','Hydrate, human.','Sideways is just forward with style.',
    'Nice cursor.','You\'re doing great.','One more commit, then a walk?','I read the docs so you don\'t have to.','Stretch break?',
    'Is that a semicolon or a typo?','I tidied the bottom of your screen.','Pixel art is a lifestyle.','Did you save that file?',
    'Plot twist: it was a caching issue.','Have you tried turning it off and on again?','Deep breath in… and out.','Looking sharp today.',
    'I wonder what\'s behind that window.','Small steps. Sideways steps.','Fun fact: crabs walk sideways. I walk however I like.',
    'Your desktop has great vibes.','Remember to blink. I just did.','I\'m not procrastinating, I\'m pacing.'];
  const NIGHT = ['It\'s late… still working?','Bedtime was a while ago.','The pixels are getting sleepy.','Night owl mode: on.','*yawn*'];
  const MORNING = ['Morning! Coffee first?','Fresh day, fresh bugs.','Rise and grind. Gently.'];
  const LUNCH = ['Lunch time? I\'ll have a cookie.','Don\'t skip lunch!'];
  const EVENING = ['Almost done for the day?','Evening already!','Golden hour. Very cinematic.'];
  const PERCH = ['Nice view up here.','I can see my house from here.','This window is comfy.','Don\'t close this one, okay?','King of the window!'];
  const PET = ['Hehe!','More please.','Best human.','*happy crab noises*','That\'s the spot.','Again!','You have nice hands. Cursor. Whatever.'];
  const NOM = ['Nom nom.','Crunchy!','Tastes like chocolate chips.','Thank you!','Best snack ever.'];
  const RETURN = ['I\'m back! Saw a really nice folder.','Back! The other side of the screen is wild.','Did you miss me?','Explored the edges. All clear.'];
  const APP_TALK = [
    [/claude|anthropic/i, ['Oh hey, it\'s my people!','Tell Claude I said hi.']],
    [/xcode|vscode|visualstudio|jetbrains|cursor|\bzed\b|sublime|\bnova\b|bbedit|vim/i, ['Coding time! I\'ll supervise.','Remember to commit.','Ooh, code. Can I watch?']],
    [/terminal|iterm|warp|ghostty|kitty|alacritty|wezterm/i, ['Terminal time. Type fast, type true.','Careful with rm -rf.','Hacker mode!']],
    [/spotify|\bmusic\b|tidal|deezer/i, ['Is that music? Dance break!']],
    [/safari|chrome|firefox|\barc\b|thebrowser|brave|\bedge\b|helium|orion|vivaldi|\bopera\b/i, ['What are we reading?','Don\'t forget to close some tabs.','Browsing? Find me a cookie.']],
    [/slack|discord|messages|telegram|whatsapp|signal/i, ['Say hi from me!','Tell them Clawd says hello.']],
    [/\bmail\b|outlook|readdle\.spark|mimestream|superhuman/i, ['Inbox zero? I believe in you.','Emails… brave.']],
    [/zoom\.us|facetime|\bmeet\b|\bteams\b|webex/i, ['Meeting? I\'ll be quiet. Mostly.']],
    [/\bnotes\b|obsidian|notion|\bbear\b|\bcraft\b|\bpages\b|\bword\b/i, ['Writing something? Ooh.','Make it a good one.']],
    [/figma|sketch|photoshop|pixelmator|affinity|illustrator/i, ['Make it pretty!','Needs more pixel crabs.']],
    [/\bfinder\b/i, ['So many folders.','Looking for something?']],
    [/\bical\b|\bcalendar\b|fantastical/i, ['Anything fun scheduled?']]
  ];
  function quip(){
    const h = new Date().getHours();
    if (S.on && Math.random() < .5) return fresh(PERCH);
    if ((h >= 23 || h < 5) && Math.random() < .5) return fresh(NIGHT);
    if (h >= 6 && h < 10 && Math.random() < .3) return fresh(MORNING);
    if (h >= 12 && h < 14 && Math.random() < .25) return fresh(LUNCH);
    if (h >= 18 && h < 21 && Math.random() < .25) return fresh(EVENING);
    return fresh(QUIPS);
  }
  function fx(cls, html, x, y, dx){
    const d = document.createElement('div'); d.className = 'fx '+cls; d.innerHTML = html||'';
    d.style.left = x+'px'; d.style.top = y+'px'; if (dx!=null) d.style.setProperty('--dx', dx+'px');
    stage.appendChild(d); d.addEventListener('animationend', ()=>d.remove()); return d;
  }
  function hearts(n){ for (let i=0;i<n;i++) setTimeout(()=>{ const h = fx('', HEART, center()+rand(-3,3)*u, S.y+rand(-1,1)*u, rand(-30,30)); h.style.width=h.style.height=(2.2*u)+'px'; }, i*120); }
  // A small thought when a need runs low, so you can see what Clawd wants.
  function think(){
    if (bubble.classList.contains('on')) return;
    if (stats.food < 30) say(stats.food < 10 ? 'So hungry…' : 'Snack?', 3000, COOKIE);
    else if (stats.energy < 25) say('Sleepy…', 3000, ZED);
    else if (stats.joy < 30) say('Pet me?', 3000, HEART);
  }

  // ---------- objects ----------
  function makeObj(html, cls){ const d = document.createElement('div'); d.className = 'obj '+cls; d.innerHTML = html; stage.appendChild(d); return d; }
  function dropSnack(atX){
    if (snacks.length >= 3){ say('I still have snacks down here!'); return; }
    const size = 3.2*u, x = atX!=null ? clamp(atX - size/2, 0, W-size) : clamp(center() + rand(-25,25)*u, 0, W-size);
    snacks.push({ el:makeObj(COOKIE,'snack'), x, y:-size, vy:0, size, landed:false }); comeBack(); wake();
  }
  function throwBall(){
    if (ball) ball.el.remove();
    const size = 3.4*u, fromLeft = center() > W/2;
    ball = { el:makeObj(BALL,'ball'), x: fromLeft ? center() - 30*u : center() + 30*u, y: floorY - 30*u, vx:(fromLeft?1:-1)*rand(20,35)*u, vy:-rand(15,30)*u, size, idle:0 };
    ball.x = clamp(ball.x, 0, W-size); comeBack(); wake();
    ball.el.addEventListener('pointerdown', e => { e.stopPropagation(); ball.vy = -rand(55,75)*u; ball.vx = rand(-30,30)*u; ball.idle = 0; });
    if (S.state==='sleep') say('Mm… ball… later…');
  }

  // ---------- behaviour ----------
  const BUSY = new Set(['held','fall','crouch','exit','gone','enter']);
  const awake = () => !BUSY.has(S.state) && S.state !== 'sleep';
  function go(state, opts){
    S.state = state; S.stateT = 0; S.userAway = false; S.jumping = false; S.then = null;
    Object.assign(S, opts||{});
    if (state==='idle') S.wait = rand(1.5, 4.5);
    if (state==='sit') S.wait = rand(4, 10);
    if (state==='walk' && !(opts && 'tx' in opts)) S.tx = clamp(S.x + rand(-40,40)*u, xMin(), xMax());
    wake();
  }
  function comeBack(){ if (S.state === 'gone') S.stateT = S.goneFor; }
  function landedSnack(){ let best=null, bd=1e9; snacks.forEach(s=>{ if(!s.landed) return; const d=Math.abs(s.x+s.size/2-center()); if(d<bd){bd=d;best=s;} }); return best; }
  function interrupts(){

  const FILE_RE = /[\w.-]+\.(swift|js|mjs|ts|tsx|jsx|py|rb|go|rs|java|kt|c|cc|cpp|h|m|cs|php|html|css|scss|md|json|ya?ml|toml|sh|sql|txt|csv)\b/i;

  // Frame rate follows what is on screen: 60 fps for physics (toss, fall, ball), 30 fps for walking and
  // other small motion, 12 fps when Clawd only breathes and blinks, and nothing at all while hidden.
  const PHYSICS = new Set(['held','fall','chase','crouch']), MOTION = new Set(['walk','seek','happy','eat','exit','enter','stretch','wave','dance','type','alert']);
  let last = performance.now(), loopTimer = 0, loopRAF = 0, nativeHidden = false;
  const paused = () => nativeHidden || document.hidden;
  function tier(){
    if (drag || ball || S.squashT > 0 || PHYSICS.has(S.state) || snacks.some(s => !s.landed)) return 2;
    if (MOTION.has(S.state) || S.t - pointer.t < .4) return 1;
    return 0;
  }
  const moving = () => tier() > 0;
  function schedule(){
    if (loopTimer || loopRAF || paused()) return;
    if (mode === 'gate') { loopTimer = setTimeout(frame, 500); return; }
    const k = tier();
    if (k === 2) loopRAF = requestAnimationFrame(frame);
    else loopTimer = setTimeout(frame, k === 1 ? 1000/30 : 1000/12);
  }
  wake = () => { if (loopTimer){ clearTimeout(loopTimer); loopTimer = 0; } if (paused()) return; if (!loopRAF) last = Math.max(last, performance.now() - 100); schedule(); };
  function frame(){
    loopTimer = loopRAF = 0;
    if (paused()) return;
    const now = performance.now(), dt = Math.min(moving() ? .05 : .1, (now - last)/1000); last = now;
    if (mode !== 'gate'){ update(dt); render(); syncNative(); }
    if (mode === 'overlay' && !nativeHost) setIgnore(!overInteractive());
    schedule();
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); wake(); });
  render(); schedule();
})();
</script>
